<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Crisp Corporate Gradients (Light theme compatible) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Subtle Architectural Grid Background -->
  <g stroke="#CBD5E1" stroke-width="1" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
  </g>

  <!-- Outer Elegant Halo -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#accentRing)" stroke-width="3" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Inner Portrait Frame -->
  <circle cx="200" cy="200" r="125" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- Executive Silhouette Portrait -->
  <g fill="url(#avatarGrad)">
    <!-- Head -->
    <circle cx="200" cy="155" r="48" />
    <!-- Neck & Collar -->
    <path d="M185 195 L215 195 L220 220 L180 220 Z" opacity="0.9" />
    <!-- Shoulders & Suit Jacket -->
    <path d="M125 310 C125 245 155 220 200 220 C245 220 275 245 275 310 Z" />
    <!-- Shirt / Tie V-Cut -->
    <polygon points="190,220 210,220 205,260 200,270 195,260" fill="#FFFFFF" />
    <!-- Modern Silk Tie -->
    <polygon points="197,230 203,230 205,275 200,285 195,275" fill="#2563EB" />
  </g>

  <!-- Badge at bottom right indicating tech engineering -->
  <g transform="translate(260, 260)">
    <circle cx="25" cy="25" r="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="25" cy="25" r="22" fill="#2563EB" />
    <!-- Code / Data icon -->
    <path d="M18 22 L14 25 L18 28 M32 22 L36 25 L32 28 M26 18 L24 32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
